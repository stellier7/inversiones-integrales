<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inversiones Integrales</title>
  <meta name="description" content="Portal de marcas — Inversiones Integrales">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>
  <main class="portal">
    <div class="brand-grid">
      <a class="brand-card" href="/megawatt/">
        <div class="brand-logo">
          <img src="assets/logos/megawatt.jpeg" alt="Megawatt" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Megawatt</div>
        </div>
        <p class="brand-tagline">Todo en luces</p>
      </a>

      <a class="brand-card" href="/lumiart/">
        <div class="brand-logo">
          <img src="assets/logos/lumiart.jpeg" alt="Lumiart" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Lumiart</div>
        </div>
        <p class="brand-tagline">Arte en iluminación</p>
      </a>

      <a class="brand-card" href="/buffalo/">
        <div class="brand-logo">
          <img src="assets/logos/buffalo.jpeg" alt="Buffalo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Buffalo</div>
        </div>
        <p class="brand-tagline">Calidad para cada proyecto</p>
      </a>

      <a class="brand-card" href="/zafiro/">
        <div class="brand-logo">
          <img src="assets/logos/zafiro.jpeg" alt="Zafiro" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Zafiro</div>
        </div>
        <p class="brand-tagline">Todo en cerámicas y inodoros</p>
      </a>

      <a class="brand-card" href="/celima/">
        <div class="brand-logo">
          <img src="assets/logos/celima.jpeg" alt="Celima" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Celima</div>
        </div>
        <p class="brand-tagline">Soluciones para tu hogar</p>
      </a>

      <a class="brand-card" href="/trebol/">
        <div class="brand-logo">
          <img src="assets/logos/trebol.jpeg" alt="Trébol" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="brand-logo-placeholder" aria-hidden="true">Trébol</div>
        </div>
        <p class="brand-tagline">Variedad para cada proyecto</p>
      </a>
    </div>
  </main>

  <footer class="portal-footer">
    <span>Inversiones Integrales</span>
  </footer>
</body>
</html>
